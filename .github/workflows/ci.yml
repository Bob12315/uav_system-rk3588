name: P1 quality gates

on: [push, pull_request]

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m compileall -q app fusion missions telemetry_link web_ui yolo_app
      - run: python -m ruff check scripts/validate_architecture_boundaries.py scripts/license_scan.py
      - run: python -m mypy --follow-imports=skip scripts/validate_architecture_boundaries.py scripts/license_scan.py
      - run: python scripts/validate_architecture_boundaries.py
      - run: python scripts/validate_action_missions.py
      - run: bash scripts/healthcheck/check_app.sh
      - run: python -m pytest -q tests/current tests/integration
      - run: python scripts/license_scan.py > runtime-license-report.txt

  linux-arm64-app:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install -r requirements/app.txt pytest ruff mypy
      - run: python -m compileall -q app fusion missions telemetry_link web_ui
      - run: python -m ruff check scripts/validate_architecture_boundaries.py scripts/license_scan.py
      - run: python -m mypy --follow-imports=skip scripts/validate_architecture_boundaries.py scripts/license_scan.py
      - run: python scripts/validate_architecture_boundaries.py
      - run: bash scripts/healthcheck/check_app.sh
      - run: python -m pytest -q tests/current tests/integration -k 'not rknn and not camera'
